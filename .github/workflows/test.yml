name: Test storefront

on:
  pull_request:
    branches:
      - main
      - "phase-2b/**"
  push:
    branches:
      - main
      - "phase-2b/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pbds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pbds_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check owner admin JavaScript syntax
        run: node --check admin/admin.js

      - name: Run automated tests
        run: npm test

      - name: Validate starter business data
        run: npm run validate

      - name: Build all demonstration storefronts
        run: npm run build:examples

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test platform-only publication controls on disposable PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: pbds_test
        run: psql -v ON_ERROR_STOP=1 -f tests/phase-2b-publication-controls.test.sql
