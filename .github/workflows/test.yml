name: Test storefront

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "phase-2b/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Check owner admin JavaScript syntax
        run: node --check admin/admin.js

      - name: Run automated tests
        run: npm test

      - name: Validate starter business data
        run: npm run validate

      - name: Build all demonstration storefronts
        run: npm run build:examples
